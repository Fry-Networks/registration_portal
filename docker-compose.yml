services:
  fry-dashboard-users:
    container_name: fry-user-dashboard
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WEEKLY_REWARDS_ENABLED: 'true'
        NEXT_PUBLIC_TEST_MODE: 'false'
        NEXT_PUBLIC_DIMO_CLIENT_ID: ${NEXT_PUBLIC_DIMO_CLIENT_ID:-'op://Dashboard/Dash Secrets/DIMO_CLIENT_ID'}
        NEXT_PUBLIC_DIMO_REDIRECT_URI: ${NEXT_PUBLIC_DIMO_REDIRECT_URI:-'op://Dashboard/Dash Secrets/DIMO_REDIRECT_URI'}
        NEXT_PUBLIC_DIMO_ENV: ${NEXT_PUBLIC_DIMO_ENV:-'production'}
        NEXT_PUBLIC_CREDENTIALS_NEEDED: 'ALL'
    init: true
    restart: unless-stopped
    networks:
      - frynet
    environment:
      HOSTNAME: "0.0.0.0"  # Force Next.js to bind to all interfaces for healthcheck
      PORT: "3007"
      NODE_ENV: production
      NODE_OPTIONS: --no-deprecation # Suppress DEP0060 warning
      NEXTAUTH_URL: 'op://Dashboard/Dash Secrets/NEXTAUTH_URL'
      NEXTAUTH_URL_INTERNAL: "http://127.0.0.1:3007"
      NEXTAUTH_SECRET: 'op://Dashboard/Dash Secrets/NEXT_AUTH_SECRET'
      STAKE_MNEMONIC: 'op://Dashboard/Dash Secrets/STAKE_MNEMONIC'
      STAKE_REKEY: 'op://Dashboard/Dash Secrets/STAKE_REKEY'
      REWARD_MNEMONIC: 'op://Dashboard/Dash Secrets/REWARD_MNEMONIC'
      REWARD_REKEY: 'op://Dashboard/Dash Secrets/REWARD_REKEY'
      MONGO_URI: 'op://Dashboard/Dash Secrets/MONGO_URI'
      VER_MONGO_URI: 'op://Dashboard/Dash Secrets/VER_MONGO_URI'
      DISCORD_BUG_WEBHOOK_URL: 'op://Dashboard/Dash Secrets/DISCORD_BUG_WEBHOOK_URL'
      DISCORD_USER_BUG_WEBHOOK_URL: 'op://Dashboard/Dash Secrets/DISCORD_USER_BUG_WEBHOOK_URL'      
      NEXT_PUBLIC_WEEKLY_REWARDS_ENABLED: 'true'
      NEXT_PUBLIC_TEST_MODE: 'false'
      WEEKLY_CUTOFF_UTC: '2025-09-12T00:00:00.000Z'
      LEGACY_VERIFICATION_FORCE_UTC: ${LEGACY_VERIFICATION_FORCE_UTC:-'2025-12-05T00:00:00.000Z'}
      NEXT_PUBLIC_LEGACY_VERIFICATION_FORCE_UTC: ${NEXT_PUBLIC_LEGACY_VERIFICATION_FORCE_UTC:-'2025-12-05T00:00:00.000Z'}
      BUG_REPORT_RATE_LIMIT_HOURS: 1
      DIMO_CLIENT_ID: 'op://Dashboard/Dash Secrets/DIMO_CLIENT_ID'
      DIMO_CLIENT_SECRET: 'op://Dashboard/Dash Secrets/DIMO_CLIENT_SECRET'
      DIMO_REDIRECT_URI: 'op://Dashboard/Dash Secrets/DIMO_REDIRECT_URI'
      DIMO_HASH_SECRET: 'op://Dashboard/Dash Secrets/DIMO_HASH_SECRET'
      DIMO_LOGIN_BASE: 'https://login.dimo.org'
      DIMO_JWKS_URL: 'https://auth.dimo.zone/keys'
      DIMO_API_BASE: 'https://api.dimo.co'
      NEXT_PUBLIC_DIMO_CLIENT_ID: 'op://Dashboard/Dash Secrets/DIMO_CLIENT_ID'
      NEXT_PUBLIC_DIMO_REDIRECT_URI: 'op://Dashboard/Dash Secrets/DIMO_REDIRECT_URI'
      NEXT_PUBLIC_DIMO_ENV: 'production'
      DIMO_ANNOUNCE_UTC: '2025-12-23T21:00:00.000Z'
      DIMO_GRACE_DAYS: 7
      DIMO_REQUIRE_ANNUAL_POST_ANNOUNCE: 'true'
      DIMO_ALLOW_POST_GRACE: 'false'
      DIMO_SNAPSHOT_TTL_MINUTES: 10
      DIMO_MINER_PREFIX: 'AEM'
      # Force Christmas theme on by default during the holiday window; users can still toggle it off client-side.
      NEXT_PUBLIC_FORCE_SEASONAL_THEME: ${NEXT_PUBLIC_FORCE_SEASONAL_THEME:-christmas} # christmas|valentines|easter|july4|thanksgiving|off|none
      NEXT_PUBLIC_DISABLE_SEASONAL_AUTO: ${NEXT_PUBLIC_DISABLE_SEASONAL_AUTO:-'false'}
      # FRY Swap Guarantee
      GUARANTEE_ENABLED: 'true'
      GUARANTEE_INSTRUMENTATION_ENABLED: 'true'
      GUARANTEE_MIN_LP_USD: '1'
      GUARANTEE_QUOTE_TTL_SECONDS: '30'
      GUARANTEE_SWAP_DEADLINE_SECONDS: '120'
      GUARANTEE_SETTLEMENT_DEADLINE_SECONDS: '600'
      GUARANTEE_MAX_TOPUP_PER_SWAP: '500000000000'
      GUARANTEE_MAX_TOPUP_PER_WALLET_DAY: '500000000000'
      GUARANTEE_MAX_TOPUP_GLOBAL_DAY: '5000000000000'
      GUARANTEE_ALLOWED_TARGET_ASSETS: '2485314946,2485202024,2485198745'
      GUARANTEE_APPROVED_SOURCES: '0,31566704,312769'
      GUARANTEE_VAULT_APP_ID: '3563123514'
      GUARANTEE_PAUSED: 'false'
      GUARANTEE_MNEMONIC: 'op://Dashboard/Guarantee Settlement Signer/GUARANTEE_MNEMONIC'
      FRY_PROXY_KEY: 'REDACTED_ROTATE_ME'
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3007/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));\""
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    read_only: true
    tmpfs:
      - /tmp
      # Ensure Next.js cache is writable by the non-root user.
      - /app/.next/cache:uid=1001,gid=1001,mode=0755
    ports:
      - '127.0.0.1:${DASHBOARD_HOST_PORT:-3007}:3007' # host_ip:host_port:container_port
    volumes:
      - /home/helpdesk/subdomains/dashb/logs:/app/logs # Persist logs outside container
      # Mount the MongoDB CA bundle so tlsCAFile is available inside the container.
      - ${MONGO_CA_CERT_PATH}:/etc/ssl/mongo/mongo-ca.crt:ro
      - /home/helpdesk/subdomains/dashb/data/preseed_merkle.json:/app/data/preseed_merkle.json:ro
    secrets:
      - op_service_account_token
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
networks:
  frynet: {}
secrets:
  op_service_account_token:
    file: /etc/opt/dashb/op_service_account_token
